name: Recorded-score checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s .
      - run: python analyze.py --output docs/data.json
      - run: git diff --exit-code -- docs/data.json
